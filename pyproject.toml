[project]
name = "python-study"
version = "0.1.0"
description = "파이썬 완전 습득 워크북 — 실습 환경"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]
# 백엔드 트랙(B1~B4)에 들어갈 때:  uv sync --group backend
backend = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",      # 비동기 SQLAlchemy 실습을 DB 설치 없이 돌리기 위해
    "greenlet>=3.0",
]
# 데이터 트랙(D1~D4)에 들어갈 때:  uv sync --group data
data = [
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.5",
    "pyarrow>=17.0",
]

[tool.pytest.ini_options]
# 알파벳 순이 아니라 학습 순서대로 수집한다 — ./study next 가 기초부터 짚어 주도록
testpaths = ["tests/basics", "tests/kit", "tests/extra", "tests/backend"]
addopts = "-q --no-header"
asyncio_mode = "auto"
markers = [
    "slow: 시간이 걸리는 측정 문제",
]

[tool.ruff]
line-length = 100
src = ["src", "solutions", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/**" = ["B", "SIM", "F401"]        # 스켈레톤은 미완성 상태가 정상이다
"solutions/**" = ["B008"]
# 테스트는 일부러 '나쁜 코드'를 재현한다 — 예외 연쇄 없는 raise, 값 안 쓰는 비교 등
"tests/**" = ["B015", "B904"]
"capstone/**/tests/**" = ["B015", "B904"]

[tool.mypy]
python_version = "3.12"
# 채점 대상은 당신이 쓰는 src/ 입니다. solutions/ 는 같은 모듈명이라 함께 볼 수 없습니다.
#   모범답안까지 검사하려면:  uv run mypy --explicit-package-bases solutions
files = ["src", "quiz"]
mypy_path = "src"
ignore_missing_imports = true
